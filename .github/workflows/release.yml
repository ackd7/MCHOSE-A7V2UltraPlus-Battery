name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 2.0.0，留空则用 tag）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 确定版本号
        id: version
        shell: pwsh
        run: |
          $ver = ""
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:INPUT_VERSION -ne "") {
            $ver = $env:INPUT_VERSION
          } elseif ($env:GITHUB_REF_NAME -match '^v(.+)$') {
            $ver = $Matches[1]
          } else {
            $ver = "2.0.0"
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "版本号: $ver"

      - name: 打包桌面分发（MSI + EXE）
        shell: pwsh
        run: |
          .\gradlew.bat :app:packageDistributionForCurrentOS -Pversion="${{ steps.version.outputs.version }}" --no-daemon

      - name: 列出产物
        shell: pwsh
        run: |
          Write-Host "=== 打包产物 ==="
          Get-ChildItem -Path app\build\compose\binaries -Recurse -Include *.msi,*.exe,*.zip -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: A7Battery v${{ steps.version.outputs.version }}
          body: |
            A7 电量助手（Compose Desktop + miuix 版）

            ## 下载
            - **安装包**：`A7Battery-${{ steps.version.outputs.version }}.msi`
            - **便携版**：`A7Battery-${{ steps.version.outputs.version }}.exe`（或对应 zip）

            ## 说明
            - 基于 Compose Multiplatform + miuix（MIUI/HyperOS 设计语言）
            - 免安装、免运行时，双击运行即显示主窗口，关闭后驻留托盘
            - 支持迈从 MCHOSE A7 V2 Ultra+ 精确电量、DPI/回报率写入
          files: |
            app/build/compose/binaries/**/*.msi
            app/build/compose/binaries/**/*.exe
            app/build/compose/binaries/**/*.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
