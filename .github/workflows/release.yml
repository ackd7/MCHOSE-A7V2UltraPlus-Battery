name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 2.0.0，留空则用 tag）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 确定版本号
        id: version
        shell: pwsh
        run: |
          $ver = ""
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:INPUT_VERSION -ne "") {
            $ver = $env:INPUT_VERSION
          } elseif ($env:GITHUB_REF_NAME -match '^v(.+)$') {
            $ver = $Matches[1]
          } else {
            $ver = "2.0.0"
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "版本号: $ver"

      - name: 设置 UTF-8 编码（避免中文乱码）
        shell: pwsh
        run: |
          echo "GRADLE_OPTS=-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8" >> $env:GITHUB_ENV
          chcp 65001

      - name: 编译检查（暴露编译错误）
        shell: pwsh
        run: |
          .\gradlew.bat :app:compileKotlinDesktop --no-daemon --stacktrace 2>&1 | Tee-Object -FilePath build-log.txt
          exit $LASTEXITCODE

      - name: 打包桌面分发（MSI）
        shell: pwsh
        run: |
          .\gradlew.bat :app:packageDistributionForCurrentOS -PappVersion="${{ steps.version.outputs.version }}" --no-daemon --stacktrace 2>&1 | Tee-Object -FilePath package-log.txt
          exit $LASTEXITCODE

      - name: 生成安装向导（NSIS，中文，可选桌面快捷方式）
        shell: pwsh
        run: |
          choco install nsis -y --no-progress --limit-output
          $env:Path += ";C:\Program Files (x86)\NSIS"
          # NSIS 不会自动创建输出目录
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          makensis -V3 /DAPP_VERSION="${{ steps.version.outputs.version }}" installer\setup.nsi 2>&1 | Tee-Object -FilePath nsis-log.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-log.txt
            package-log.txt
            nsis-log.txt

      - name: 列出产物
        shell: pwsh
        run: |
          Write-Host "=== 打包产物 ==="
          Get-ChildItem -Path app\build\compose\binaries -Recurse -Include *.msi,*.exe,*.zip -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

      - name: 生成 Release 说明（从 CHANGELOG 提取）
        shell: pwsh
        run: |
          $ver = "${{ steps.version.outputs.version }}"
          $lines = Get-Content -Path CHANGELOG.md -Encoding UTF8
          $note = @()
          $capture = $false
          foreach ($l in $lines) {
            if ($l -match '^##\s') {
              if ($capture) { break }
              if ($l -match [regex]::Escape($ver)) { $capture = $true; continue }
            } elseif ($capture) { $note += $l }
          }
          while ($note.Count -gt 0 -and [string]::IsNullOrWhiteSpace($note[-1])) {
            $note = @($note | Select-Object -First ($note.Count - 1))
          }
          if ($note.Count -eq 0) { $note = @('- 本版本未在 CHANGELOG.md 中找到条目') }

          $body = @()
          $body += '## 更新内容'
          $body += ''
          $body += $note
          $body += ''
          $body += '## 下载'
          $body += ''
          $body += ('- **推荐**：`MCHOSE-A7V2-Ultra-Battery-Setup-{0}.exe` —— 中文安装向导，可勾选「创建桌面快捷方式」「开机自动启动」，无需管理员权限' -f $ver)
          $body += ('- **备用**：`A7Battery-{0}.msi` —— Windows Installer（英文向导）' -f $ver)
          $body += ''
          $body += '## 说明'
          $body += ''
          $body += '- 界面参考 [mochi-compose](https://github.com/feice11/mochi-compose)：iOS 式分组卡片 + 悬浮胶囊标签栏'
          $body += '- 安装包自带 JRE，无需额外运行时'
          $body += '- 支持 MCHOSE A7 V2 Ultra+ 电量读取、DPI / 回报率读写'

          $body | Set-Content -Path release-notes.md -Encoding UTF8
          Write-Host '=== Release 说明 ==='
          Get-Content release-notes.md -Encoding UTF8

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: A7Battery v${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/*.exe
            app/build/compose/binaries/**/*.msi
            app/build/compose/binaries/**/*.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
