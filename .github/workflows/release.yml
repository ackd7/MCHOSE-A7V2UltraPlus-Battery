name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（如 2.0.0，留空则用 tag）'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 设置 Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 确定版本号
        id: version
        shell: pwsh
        run: |
          $ver = ""
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch" -and $env:INPUT_VERSION -ne "") {
            $ver = $env:INPUT_VERSION
          } elseif ($env:GITHUB_REF_NAME -match '^v(.+)$') {
            $ver = $Matches[1]
          } else {
            $ver = "2.0.0"
          }
          echo "version=$ver" >> $env:GITHUB_OUTPUT
          Write-Host "版本号: $ver"

      - name: 设置 UTF-8 编码（避免中文乱码）
        shell: pwsh
        run: |
          echo "GRADLE_OPTS=-Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Dstderr.encoding=UTF-8" >> $env:GITHUB_ENV
          chcp 65001

      - name: 编译检查（暴露编译错误）
        shell: pwsh
        run: |
          .\gradlew.bat :app:compileKotlinDesktop --no-daemon --stacktrace 2>&1 | Tee-Object -FilePath build-log.txt
          exit $LASTEXITCODE

      - name: 打包桌面分发（MSI）
        shell: pwsh
        run: |
          .\gradlew.bat :app:packageDistributionForCurrentOS -PappVersion="${{ steps.version.outputs.version }}" --no-daemon --stacktrace 2>&1 | Tee-Object -FilePath package-log.txt
          exit $LASTEXITCODE

      - name: 生成安装向导（NSIS，中文，可选桌面快捷方式）
        shell: pwsh
        run: |
          choco install nsis -y --no-progress --limit-output
          $env:Path += ";C:\Program Files (x86)\NSIS"
          # NSIS 不会自动创建输出目录
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          makensis -V3 /DAPP_VERSION="${{ steps.version.outputs.version }}" installer\setup.nsi 2>&1 | Tee-Object -FilePath nsis-log.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: 上传构建日志（失败时）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build-log.txt
            package-log.txt
            nsis-log.txt

      - name: 列出产物
        shell: pwsh
        run: |
          Write-Host "=== 打包产物 ==="
          Get-ChildItem -Path app\build\compose\binaries -Recurse -Include *.msi,*.exe,*.zip -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName

      - name: 创建 Release 并上传产物
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          name: A7Battery v${{ steps.version.outputs.version }}
          body: |
            A7 电量助手（Compose Desktop + miuix 版）

            ## 下载
            - **推荐**：`A7Battery-Setup-${{ steps.version.outputs.version }}.exe`
              中文安装向导，安装时可勾选「创建桌面快捷方式」「开机自动启动」，按当前用户安装、无需管理员权限。
            - **备用**：`A7Battery-${{ steps.version.outputs.version }}.msi`（Windows Installer，英文向导）

            ## 说明
            - 界面参考 [mochi-compose](https://github.com/feice11/mochi-compose)：iOS 式分组卡片 + 悬浮胶囊标签栏
            - 免安装运行时，安装包自带 JRE
            - 支持迈从 MCHOSE A7 V2 Ultra+ 精确电量、DPI/回报率读写
          files: |
            dist/*.exe
            app/build/compose/binaries/**/*.msi
            app/build/compose/binaries/**/*.zip
          draft: false
          prerelease: false
          fail_on_unmatched_files: false
